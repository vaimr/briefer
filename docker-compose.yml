services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER}
      - MATRIX_USER=${MATRIX_USER}
      - MATRIX_PASSWORD=${MATRIX_PASSWORD}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MATRIX_HEALTH_PORT=8000
    volumes:
      - ./data:/data
      - ./bot/help.txt:/etc/briefer/help.txt:ro
      - results:/tmp/results:ro

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - WORKER_REDIS_HOST=redis
      - WORKER_REDIS_PORT=6379
      - WORKER_LLM_API_URL=http://faex:8080/v1
      - WORKER_LLM_MODEL_NAME=qwen3.6-a3b-mtp:35b
      - WORKER_WHISPER_MODEL=large-v3
      - WORKER_DATA_DIR=/data
      - WORKER_HEALTH_PORT=8000
      - TZ=Europe/Moscow
    volumes:
      - ./data:/data
      - results:/tmp/results
      - whisper_cache:/root/.cache/huggingface
    extra_hosts:
      - "faex:192.168.0.104"

volumes:
  redis_data:
  whisper_cache:
  results:
